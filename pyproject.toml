[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "archive-line-index"
version = "0.4.0"
description = "Sequential archive payload streaming and byte-line indexing."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "py7zr>=1.1.4,<1.2",
]

[project.optional-dependencies]
dev = [
    "build",
    "mypy",
    "pytest>=9",
    "pytest-cov",
    "pytest-asyncio",
    "pytest-timeout",
    "ruff",
    "flowmark",
]
lint = [
    "ruff",
    "mypy",
]
tools = [
    "hatch",
    "uv",
]
test = [
    "pytest>=9",
    "pytest-cov",
    "pytest-benchmark",
    "pytest-asyncio",
    "pytest-timeout",
    "coverage",
]

[project.scripts]
archive-line-index = "archive_line_index.cli:main"

[tool.hatch.build]
exclude = [
    "/.coverage",
    "/.mypy_cache",
    "/.pytest_cache",
    "/.ruff_cache",
    "/.venv",
    "/dist",
    "/release",
    "/**/__pycache__",
    "/**/*.tkn",
    "/**/.env",
    "/**/.agents",
    "/**/ai-logs",
]

[tool.hatch.build.targets.sdist]
only-include = [
    "src",
    "tests",
    "scripts",
    "pyproject.toml",
    "README.md",
    "RELEASE-NOTES.md",
    "LICENSE",
    "AI_DISCLOSURE.md",
    "SDD-MANAGER.md",
    "docs/dev",
]

[tool.hatch.build.targets.wheel]
packages = ["src/archive_line_index"]

[tool.pytest]
required_plugins = ["pytest-asyncio", "pytest-timeout"]
addopts = ["-ra", "-q", "--strict-config", "--strict-markers", "--import-mode=importlib"]
pythonpath = ["src", "."]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
timeout = "60"
markers = [
    "integration: tests that start worker processes",
    "slow: tests with deliberately long skew or shutdown waits",
    "windows: Windows-specific behavior",
]

[tool.coverage.run]
branch = true
source = ["archive_line_index"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
# Match Black defaults to minimize surprise.
line-length = 88
indent-width = 4
respect-gitignore = true
src = ["src", "tests"]
# Keep CI noise down; allow intentional "unused" patterns.
exclude = [
    ".git",
    ".venv",
    "venv",
    "build",
    "dist",
    "__pypackages__",
    ".mypy_cache",
    ".pytest_cache",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
# Black-like formatting.
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "ANN", # flake8 type annotations
    #"SIM",
    #"RUF", # ruff-specific rules
]

# Avoid overreach / churny style rules that don't pay for themselves in R&D code.
ignore = [
    "E501",   # line length: formatter handles wrapping; keep lint silent
    "B008",   # function calls in defaults; common/acceptable for small factories in research code
]

# Enable autofix, but keep it safe and unsurprising.
fixable = ["ALL"]
unfixable = [
    # Don't let auto-fix rewrite exception messages / f-strings in ways you don't expect.
    # (Optional; remove if you want aggressive rewrites.)
]

[tool.ruff.lint.per-file-ignores]
# Tests can be looser.
"tests/**/*.py" = [
    "E402",   # imports not at top (fixtures sometimes)
    "F811",   # redefinition (pytest param fixtures can trip this)
    "B018",   # useless expression (sometimes used as markers)
]

# __init__.py often intentionally re-exports.
"**/__init__.py" = ["F401"]

# Script-ish entrypoints / notebooks-exported files often need some flexibility.
"scripts/**/*.py" = ["E402", "F401"]

[tool.ruff.lint.isort]
# Keep imports stable across the repo; update if your top-level package differs.
known-first-party = ["archive_line_index"]
combine-as-imports = true

[tool.mypy]
strict = true
files = ["src"]
warn_unused_configs = true
warn_return_any = true
disallow_untyped_defs = true

[tool.flowmark]
width = 88
semantic = false
smartquotes = false
ellipses = false
cleanups = true
list-spacing = "preserve"
